apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurapath-backend
  labels:
    app: aurapath-backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aurapath-backend
  template:
    metadata:
      labels:
        app: aurapath-backend
    spec:
      containers:
        - name: backend
          image: aurapath/backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aurapath-backend-svc
spec:
  selector:
    app: aurapath-backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: ClusterIP

version: '3.8'

services:
  # Primary Relational Database (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: aurapath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurapath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurapath_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aurapath_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurapath} -d ${POSTGRES_DB:-aurapath_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Background Jobs (BullMQ), Rate Limiting & Session Caching
  redis:
    image: redis:7-alpine
    container_name: aurapath-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3-Compatible Private Object Storage (Report PDFs Stub)
  minio:
    image: minio/minio:latest
    container_name: aurapath-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Automatic Bucket Provisioning for MinIO
  createbuckets:
    image: minio/mc:latest
    container_name: aurapath-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET_NAME:-aurapath-private-reports};
      mc anonymous set none local/${S3_BUCKET_NAME:-aurapath-private-reports};
      exit 0;
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
